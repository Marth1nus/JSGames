<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wordle</title>
    <style>
      #wordle {
        & /* Variables */ {
          --words-count: 6;
          --word-length: 5;
          --letter-width: 1em;
          --pallet-0: #185;
          --pallet-1: #eee;
          --pallet-used: yellow;
          --pallet-correct: cyan;
        }
        & /* #wordle */ {
          color: var(--pallet-0);
        }
        & > .border {
          border: 0.5em inset color-mix(in srgb, currentColor 40%, transparent);
          background-color: color-mix(in srgb, currentColor 20%, transparent);
          border-radius: 1em;
          padding: 1em;
          display: grid;
          grid-template-columns: 1fr;
          justify-content: center;
          gap: 0.5em;
        }
        & button {
          background-color: var(--pallet-1);
          border: 0.2em outset color-mix(in srgb, currentColor 60%, transparent);
          border-radius: 0.5em;
          color: inherit;
          &:focus,
          &:hover {
            background-color: color-mix(in srgb, var(--pallet-1) 80%, transparent);
          }
          &:active {
            background-color: color-mix(in srgb, var(--pallet-1) 60%, transparent);
            border-radius: 0.6em;
            border-style: inset;
          }
        }
        & header {
          text-align: center;
          background-color: color-mix(in srgb, var(--pallet-1) 99%, transparent);
          border-radius: 1em;
          font-size: large;
          padding: 0.2em;
        }
        & ol.letters {
          display: grid;
          grid-template:
            repeat(var(--words-count), 1fr) /
            repeat(var(--word-length), auto);
          justify-content: center;
          gap: 0.5em 0.05em;
          list-style: none;
          padding: 0;
          margin: 0;
          & > li {
            font-size: x-large;
            text-align: center;
            background-color: color-mix(in srgb, var(--pallet-1) 99%, black);
            width: var(--letter-width);
            height: var(--letter-width);
            padding: 0.3em;
            border: 0.1em outset color-mix(in srgb, currentColor 60%, transparent);
            border-radius: 0.3em;
            &.submitted {
              background-color: color-mix(in srgb, var(--pallet-1) 80%, black);
            }
            &.submitted.used {
              background-color: var(--pallet-used);
            }
            &.submitted.used.correct {
              background-color: var(--pallet-correct);
            }
          }
        }
        & .notify {
          text-align: center;
          transition: opacity 1s ease;
        }
        & .definitions {
          width: min(90vw, 24em);
          & details .preview {
            margin: 0 0 0 1em;
            padding: 0 0 0 0.2em;
            border-left: 0.3em inset currentColor;
            border-radius: 0.1em;
          }
          & details[open] .preview {
            display: none;
          }
          & .phonetic button {
            outline: none;
            border: 1px outset --pallet-0;
            border-radius: 10em;
            background: none;
            padding: 0.2em;
            margin: 0;
          }
          & ol {
            padding: 0 0 0 1em;
          }
          & details {
            padding: 0 0 0 0;
            border-left: 0.5em inset color-mix(in srgb, currentColor 00%, transparent);
            border-radius: 0.2em;
            &[open] {
              border-left-color: color-mix(in srgb, currentColor 33%, transparent);
            }
            & > * {
              margin: 0 0 0 0.5em;
            }
            & > summary {
              margin: 0 0 0 -0.5em;
            }
          }
        }
        & .keyboard {
          width: 90vw;
          max-width: 24em;
          display: grid;
          grid-template: repeat(3, 1fr) / repeat(20, 1fr);
          gap: 0.05em;
          & > button {
            aspect-ratio: 1;
            background-color: color-mix(in srgb, var(--pallet-1) 99%, black);
            & /* Grid Row Offsets */ {
              grid-column: auto / span 2;
              &:nth-of-type(1) {
                grid-column: 1 / span 2;
              }
              &:nth-of-type(11) {
                grid-column: 2 / span 2;
              }
              &:nth-of-type(20) {
                grid-column: 3 / span 2;
              }
            }
            &.submitted {
              background-color: color-mix(in srgb, var(--pallet-1) 80%, black);
            }
            &.submitted.used {
              background-color: var(--pallet-used);
            }
            &.submitted.used.correct {
              background-color: var(--pallet-correct);
            }
          }
        }
        & .buttons {
          display: grid;
          grid-template: 2fr 1fr 1fr / repeat(10, 1fr);
          grid-template-areas:
            '. a a a . . b b b .'
            '. . . . . . . . . .'
            'c c . . . . . . d d';
          &>* /* Grid Offsets */ {
            &:nth-child(1) {
              grid-area: a;
            }
            &:nth-child(2) {
              grid-area: b;
            }
            &:nth-child(3) {
              grid-area: c;
            }
            &:nth-child(4) {
              grid-area: d;
            }
          }
        }
      }
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-width: 100vw;
        min-height: 100vh;
      }
    </style>
    <script type="module">
      const wordLength = 5
      const wordsCount = 6

      const DOMContentLoaded = (async () => {
        await new Promise(resolve =>
          document.readyState !== 'loading'
            ? resolve()
            : document.addEventListener('DOMContentLoaded', resolve, { once: true }),
        )
      })()
      const DOMPopulated = (async () => {
        await DOMContentLoaded
        const mobileInput = (() => {
          const input = document.createElement('input')
          input.id = 'mobile-input'
          input.type = 'text'
          input.autocomplete = 'off'
          input.autocorrect = false
          input.spellcheck = false
          input.style = 'position:absolute; opacity:0; width:0; height:0; pointer-events:none;'
          input.addEventListener('keydown', mobileInputOnKey)
          document.querySelector('#wordle').prepend(input)
          return input
        })()
        document.querySelectorAll('#wordle .letters').forEach(div => {
          div.replaceChildren(
            ...Array.from({ length: wordsCount }).flatMap((c, i) => {
              const li = document.createElement('li')
              li.className = 'letter'
              li.innerText = 'WORDLE'[i] || ''
              return Array.from({ length: wordLength }, () => li.cloneNode(true)) //
                .filter(li => li instanceof HTMLLIElement)
            }),
          )
          div.addEventListener('click', () => {
            const input = document.querySelector('#wordle input#mobile-input')
            if (!(input instanceof HTMLInputElement)) throw new Error('missing <input id="mobile-input">')
            input.focus({ preventScroll: true })
          })
        })
        document.querySelectorAll('#wordle .keyboard').forEach(div => {
          div.replaceChildren(
            ...Array.from('qwertyuiop asdfghjkl zxcvbnm←'.toUpperCase(), c => {
              if (/^\s$/.test(c)) return
              const btn = document.createElement('button')
              btn.innerText = c
              return btn
            }).filter(Boolean),
          )
        })
        document.querySelectorAll('#wordle button').forEach(btn => {
          btn.addEventListener('click', generalButtonOnClick)
        })
        mobileInput.focus()
      })()
      /** @param {Url} url */
      const fetchWords = async url => {
        const response = await fetch(url)
        const text = await response.text()
        const lines = text.split(/\r?\n/)
        const [headerRow, ...rows] = lines.map(line => line.split(/,/).map(word => word.trim()))
        const wordHeaderIndex = headerRow.indexOf('word')
        const words = rows.map(row => row[wordHeaderIndex]).filter(Boolean)
        return new Set(words)
      }
      const [words, ..._] = await Promise.all([fetchWords('data/wordle/words.csv'), DOMPopulated])

      const makeWordleGame = (wordleDivId = 'wordle') => ({
        words,
        wordsCount,
        wordLength,
        i: 0,
        result: '',
        solution: '',
        get gameOver() {
          return this.i >= this.wordsCount || Boolean(this.result)
        },
        get word() {
          return this.gameOver
            ? this.solution
            : this.wordLetters
                .map(letter => letter.textContent[0])
                .filter(Boolean)
                .join('')
                .toLowerCase()
        },
        set word(word) {
          word = `${word}`.toLowerCase()
          if (this.gameOver) throw new Error(`wordle.word = "${word}" is disallow after game-over`)
          const { wordLetters } = this
          if (!(/^[a-zA-Z]*$/.test(word) && word.length <= wordLetters.length))
            throw new Error(`"${word}" is not a valid ${wordLetters.length}-letter word`)
          for (let j = 0; j < wordLetters.length; j++) {
            wordLetters[j].textContent = (word[j] || '').toUpperCase()
          }
        },

        divId: wordleDivId,
        get letters() {
          return [...document.querySelectorAll(`#${this.divId} ol.letters > li`)] //
            .filter(li => li instanceof HTMLLIElement)
        },
        get wordLetters() {
          const { letters, i, wordLength, gameOver } = this
          return gameOver ? [] : letters.slice((i + 0) * wordLength, (i + 1) * wordLength)
        },
        get keyboardKeys() {
          return [...document.querySelectorAll(`#${this.divId} .keyboard > button`)] //
            .filter(button => button instanceof HTMLButtonElement)
        },
        get definitionsDivs() {
          return [...document.querySelectorAll(`#${this.divId} div.definitions`)] //
            .filter(div => div instanceof HTMLDivElement)
        },
        notify(message = 'Guess the Word') {
          const notify = document.querySelector(`#${this.divId} .notify`)
          if (!(notify instanceof HTMLElement)) throw new Error('Missing Notify div')
          notify.textContent = message
          notify.style.opacity = 1.0
          clearTimeout(this.notifyTimeout)
          this.notifyTimeout = setTimeout(() => (notify.style.opacity = 0.66), 3000)
        },

        reset() {
          const { letters, definitionsDivs, keyboardKeys } = this
          for (const letter of letters) {
            letter.textContent = ''
            letter.className = ''
          }
          for (const key of keyboardKeys) {
            key.className = ''
          }
          for (const definitionsDiv of definitionsDivs) {
            definitionsDiv.replaceChildren()
          }
          this.i = 0
          this.result = ''
          this.solution = [...this.words][Math.floor(Math.random() * this.words.size)]
          this.notify()
          document.querySelector(`#${this.divId} input#mobile-input`).focus({ preventScroll: false })
          console.debug({ wordle: this })
        },
        submit() {
          const { gameOver, result, solution } = this
          if (gameOver) return this.notify(`You ${result}! Solution was "${solution}"`)
          const { word, wordLength, words } = this
          if (word.length < wordLength || !words.has(word))
            return this.notify(`"${word.padEnd(wordLength, '.')}" is not a valid word`)

          const { wordLetters, keyboardKeys } = this
          const i = (this.i += 1) // Word accepted
          const keys = Object.fromEntries(keyboardKeys.map(key => [key.textContent[0].toLowerCase(), key]))
          for (let j = 0; j < wordLetters.length; j++) {
            const divs = [wordLetters[j], keys[word[j]]]
            const tokens = [
              [/* */ 'submitted', true],
              [/*      */ 'used', solution.includes(word[j])],
              [/*   */ 'correct', solution[j] === word[j]],
            ]
            for (const div of divs)
              for (const [token, tokenOn] of tokens) //
                if (tokenOn) div.classList.add(token)
          }
          if (word === solution) return this.endGame('won')
          if (i >= wordsCount) return this.endGame('lost')
        },

        /** @param {'won'|'lost'} result */
        async endGame(result) {
          if (!/^(won|lost)$/.test(result)) throw new Error(`Call to end game with invalid result: "${result}"`)
          ;[this.i, this.result] = [wordsCount, result]
          this.notify(`You ${result}! Solution was "${this.solution}"`)
          return await this.showSolutionDefinition()
        },
        async showSolutionDefinition() {
          const { solution, definitionsDivs, wordLength } = this
          for (const div of definitionsDivs) div.replaceChildren(`loading definition of "${solution}"...`)

          if (!(/^[a-z]+$/.test(solution) && solution.length == wordLength))
            throw new Error(`Solution word is invalid: "${solution}"`)
          const response = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${solution}`)
          /** @type {{
           *  word            : string,
           *  phonetic        : string,
           *  phonetics       : {
           *    text          : string,
           *    audio         : URL,
           *    sourceURL     : URL,
           *    license       : {
           *      name        : string,
           *      url         : URL,
           *    },
           *  }[],
           *  meanings        : {
           *    partOfSpeech  : string,
           *    definitions   : {
           *      definition  : string,
           *      synonyms    : string[],
           *      antonyms    : string[],
           *    }[],
           *    synonyms      : string[],
           *    antonyms      : string[],
           *  }[],
           *  license         : {
           *    name          : string,
           *    url           : URL,
           *  },
           *  sourceUrls      : URL[],
           * }[]|{
           *  title           : "No Definition Found",
           *  message         : string,
           *  resolution      : string,
           * }} */
          const words = await response.json()

          const tag = (tag = 'div', attribs = {}, children = []) => {
            const div = document.createElement(tag)
            if (!(div instanceof HTMLElement)) throw new Error()
            for (const attrib in attribs) div[attrib] = attribs[attrib]
            div.replaceChildren(...children)
            return div
          }
          /** @returns {null|HTMLElement[]} */
          const conditionalTags = condition => (condition ? null : [])
          const synonymsAntonymsTags = (synonyms = [], antonyms = [], preBr = false) =>
            [
              { title: 'synonyms', words: synonyms },
              { title: 'antonyms', words: antonyms },
            ].flatMap((value, i) => [
              ...(conditionalTags(value.words.length > 0) ?? [
                ...(conditionalTags(i > 0 || preBr) ?? [tag('br')]),
                tag('small', {}, [tag('b', {}, [value.title]), ': ', value.words.join(', ')]),
              ]),
            ])

          const wordsDiv = tag(
            'div',
            { className: 'definitions' },
            'title' in words
              ? [`No definition found for "${solution}"`]
              : words.map(word =>
                  tag('details', {}, [
                    tag('summary', {}, [
                      tag('strong', {}, [word.word]),
                      ...(conditionalTags(word.phonetics.length > 0) ?? [
                        tag('span', { className: 'phonetic' }, [
                          tag('sub', {}, [word.phonetics[0].text]),
                          ...(conditionalTags(word.phonetics[0].audio) ?? [
                            tag('button', {}, ['🔉']),
                            tag('audio', { src: word.phonetics[0].audio }),
                          ]),
                        ]),
                      ]),
                      tag('div', { className: 'preview' }, [
                        tag('sup', {}, [word.meanings[0].partOfSpeech]),
                        word.meanings[0].definitions[0].definition,
                      ]),
                    ]),
                    ...word.meanings.map(meaning =>
                      tag('details', {}, [
                        tag('summary', {}, [tag('strong', {}, [meaning.partOfSpeech])]),
                        ...synonymsAntonymsTags(meaning.synonyms, meaning.antonyms),
                        tag('ol', {}, [
                          ...meaning.definitions.map(definition =>
                            tag('li', {}, [
                              definition.definition,
                              ...synonymsAntonymsTags(definition.synonyms, definition.antonyms),
                            ]),
                          ),
                        ]),
                      ]),
                    ),
                    tag('details', {}, [
                      tag('summary', {}, ['sources']),
                      tag('ol', {}, [
                        ...word.sourceUrls.map(source => tag('li', {}, [tag('a', { href: source }, [source])])),
                      ]),
                    ]),
                  ]),
                ),
          )

          const onPhoneticButtonClick = async event => {
            if (!(event instanceof Event)) throw new Error(`invalid event type`)
            if (!(event.target instanceof HTMLButtonElement)) throw new Error(`invalid click target`)
            const audio = event.target.parentNode.querySelector('& > audio')
            if (!(audio instanceof HTMLAudioElement))
              throw new Error(`<button> must be in same <element> as <audio> to play`)
            audio.currentTime = 0
            audio.volume = 0.5
            await audio.play()
          }
          let prevDefinitionDivs
          for (const oldDefinitionDivs of definitionsDivs) {
            const newDefinitionDivs = prevDefinitionDivs ? wordsDiv.cloneNode(true) : (prevDefinitionDivs = wordsDiv)
            if (!(newDefinitionDivs instanceof HTMLDivElement)) throw new Error()
            for (const button of newDefinitionDivs.querySelectorAll('.phonetic button')) {
              if (!(button instanceof HTMLButtonElement)) throw new Error()
              button.addEventListener('click', onPhoneticButtonClick)
            }
            oldDefinitionDivs.replaceWith(newDefinitionDivs)
          }
        },
      })

      const wordle = makeWordleGame()
      wordle.reset()

      /** @param {string} key */
      function onKey(key) {
        /**/ if (/^([a-zA-Z])$/.test(key)) {
          const { gameOver, word, wordLength } = wordle
          if (!gameOver && word.length < wordLength) {
            wordle.word = word + key[0]
          }
        } //
        else if (/^(Enter)$/.test(key)) {
          if (wordle.gameOver) wordle.reset()
          else wordle.submit()
        } //
        else if (/^(Backspace|←)$/.test(key)) {
          const { gameOver, word } = wordle
          if (!gameOver && word) wordle.word = word.substr(0, word.length - 1)
        } //
      }
      function generalButtonOnClick(event) {
        if (!(event instanceof PointerEvent)) throw new Error('Not a PointerEvent')
        if (!(event.target instanceof HTMLButtonElement)) throw new Error('Not from a <button>')
        const buttonBehavior = event.target.textContent.toLowerCase()
        const command = {
          submit: () => wordle.submit(),
          clear: () => wordle.gameOver || (wordle.word = ''),
          reset: () => wordle.reset(),
        }[buttonBehavior]
        if (command) command()
        else onKey(buttonBehavior)
      }
      function mobileInputOnKey(event) {
        if (!(event instanceof KeyboardEvent)) throw new Error('bad event type')
        if (!(event.target instanceof HTMLInputElement)) throw new Error('bad event target')
        if (/^(Enter|Backspace|[a-zA-Z])$/.test(event.key)) {
          event.target.value = ''
          event.preventDefault()
          onKey(event.key)
        }
      }
      async function playRandomGame(win = true) {
        const { words, wordsCount, solution } = wordle
        const wordsArray = [...words]
        const playedWordsCount = !win ? wordsCount : 2 + Math.floor(Math.random() * (wordsCount - 2))
        await sleep(3000)
        for (let i = 0; i < playedWordsCount; i++) {
          const word =
            win && i === playedWordsCount - 1 //
              ? solution
              : wordsArray[Math.floor(Math.random() * wordsArray.length)]
          for (const key of [...word, 'Enter']) {
            onKey(key)
            await sleep(20)
          }
        }
      }
      async function sleep(milliseconds = 0) {
        await new Promise(resolve => setTimeout(resolve, milliseconds))
      }
    </script>
  </head>
  <body>
    <div id="wordle">
      <div class="border">
        <header>Guess the Word</header>
        <ol class="letters">
          <li class="loader">Loading Words</li>
        </ol>
        <div class="notify">Guess the Word</div>
        <div class="keyboard">
          <div class="loader">Loading Keyboard</div>
        </div>
        <div class="buttons">
          <button>Submit</button>
          <button>Clear</button>
          <button>Reset</button>
        </div>
        <div class="definitions"></div>
      </div>
    </div>
  </body>
</html>
